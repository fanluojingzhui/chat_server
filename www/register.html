<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - C++ 聊天室</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>创建账号</h1>
        <p class="subtitle">加入聊天室</p>
        
        <form action="/register" method="POST">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required placeholder="输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required placeholder="输入密码">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" name="email" required placeholder="输入邮箱">
            </div>
            <button type="submit">注册</button>
        </form>
        
        <p class="link">已有账号？<a href="/login.html">去登录</a></p>
    </div>
</body>
</html>
