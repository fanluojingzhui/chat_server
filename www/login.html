<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - C++ 聊天室</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>欢迎回来</h1>
        <p class="subtitle">登录你的账号</p>
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required placeholder="输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required placeholder="输入密码">
            </div>
            <button type="submit">登录</button>
        </form>
        
        <p class="link">没有账号？<a href="/register.html">立即注册</a></p>
    </div>
</body>
</html>
