<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室 - C++ 聊天室</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="chat-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>💬 聊天室</h2>
            </div>
            <div class="user-info">
                <div class="name" id="username">加载中...</div>
                <div class="status">● 在线</div>
            </div>
            <div class="online-users">
                <h3>在线用户</h3>
                <div id="userList"></div>
            </div>
        </div>
        
        <div class="chat-main">
            <div class="chat-header">
                <h2># 公共聊天室</h2>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="输入消息..." 
                       onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>
    
    <script>
        let ws = null;
        let username = '';
        
        async function getCurrentUser() {
            try {
                const response = await fetch('/api/current-user');
                const data = await response.json();
                return data.username;
            } catch (error) {
                console.error('获取用户信息失败:', error);
                return '';
            }
        }
        
        async function init() {
            username = await getCurrentUser();
            
            if (!username) {
                window.location.href = '/login.html';
                return;
            }
            
            document.getElementById('username').textContent = username;
            
            ws = new WebSocket('ws://' + location.host + '/ws');
            
            ws.onopen = () => {
                console.log('WebSocket 已连接');
                ws.send(JSON.stringify({
                    type: 'join',
                    username: username
                }));
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };
            
            ws.onclose = () => {
                console.log('WebSocket 已断开');
                addSystemMessage('连接已断开');
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket 错误:', error);
            };
        }
        
        function handleMessage(data) {
            switch (data.type) {
                case 'chat':
                    addMessage(data.username, data.message, data.username === username);
                    break;
                case 'system':
                    addSystemMessage(data.message);
                    break;
                case 'users':
                    updateUserList(data.users);
                    break;
                case 'error':
                    alert(data.message);
                    window.location.href = '/login.html';
                    break;
            }
        }
        
        function addMessage(sender, message, isOwn) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message' + (isOwn ? ' own' : '');
            
            const time = new Date().toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit'
            });
            
            div.innerHTML = `
                <div class="sender">${isOwn ? '我' : sender}</div>
                <div class="bubble">${escapeHtml(message)}</div>
                <div class="time">${time}</div>
            `;
            
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }
        
        function addSystemMessage(message) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.color = '#999';
            div.style.fontSize = '13px';
            div.style.margin = '10px 0';
            div.textContent = message;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }
        
        function updateUserList(users) {
            const list = document.getElementById('userList');
            list.innerHTML = '';
            users.forEach(user => {
                const div = document.createElement('div');
                div.className = 'user-item';
                div.textContent = user;
                list.appendChild(div);
            });
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || !ws) return;
            
            ws.send(JSON.stringify({
                type: 'chat',
                message: message
            }));
            
            input.value = '';
        }
        
        function logout() {
            if (ws) ws.close();
            window.location.href = '/logout';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        init();
    </script>
</body>
</html>
