<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎 - C++ 聊天室</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>欢迎，<span id="username"></span>!</h1>
        <p class="subtitle">登录成功</p>
        
        <div style="margin-top: 24px;">
            <a href="/chat.html" style="text-decoration: none;">
                <button>进入聊天室</button>
            </a>
        </div>
        
        <p class="link"><a href="/logout">退出登录</a></p>
    </div>

    <script>
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
            const [name, value] = cookie.trim().split('=');
            if (name === 'username') {
                document.getElementById('username').textContent = value;
            }
        }
    </script>
</body>
</html>
